name: Desktop CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop-app/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run unit tests (pure logic, no display needed)
        run: pytest -v

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux runtime dependency for tkinter)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - run: pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --name ab-demo-desktop app.py

      - uses: actions/upload-artifact@v4
        with:
          name: ab-demo-desktop-${{ matrix.os }}
          path: desktop-app/dist/*
